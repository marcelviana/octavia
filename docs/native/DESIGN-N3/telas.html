document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

eight:1.55;text-wrap:pretty\">Faixa <b style=\"color:#F9F5F1;font-weight:600\">B<\u002Fb> (600–960 dp, tablet em pé) desenhada em <b style=\"color:#F9F5F1;font-weight:600\">711 × 1054 dp<\u002Fb>; faixa <b style=\"color:#F9F5F1;font-weight:600\">A<\u002Fb> (&lt; 600, celular em pé) em <b style=\"color:#F9F5F1;font-weight:600\">411 × 874 dp<\u002Fb>. As molduras são a área útil, sem barra de status nem de navegação, em escala 1:1 com a faixa C (1138 × 627). Tudo aqui é anotado por cima do congelado, no padrão E16: mesmos tokens, mesmas frases, mesmos testIDs, mesmo catálogo de 39 ícones. Nenhuma frase nova e nenhum ícone novo nesta folha.<\u002Fdiv>\n  <div style=\"font-size:17px;color:#A9A5B5;line-height:1.55;text-wrap:pretty\">Uma regra organiza a folha inteira: <b style=\"color:#F9F5F1;font-weight:600\">quando não cabe, a composição empilha; o conteúdo não sai<\u002Fb>. Linha de controles vira duas linhas, cartão cresce em altura, grade de duas colunas vira uma. Nenhum controle some, nenhum texto de leitura encolhe; só o display de S5 ganha um degrau menor na faixa A. As medidas de largura de texto vêm das capturas do AVD (px ÷ 2,127 em B, px ÷ 2,628 em A) e estão marcadas <span style=\"font-family:'IBM Plex Mono',monospace;color:#F9F5F1\">[captura]<\u002Fspan>; as demais são de token ou soma declarada.<\u002Fdiv>\n  <div style=\"display:flex;gap:28px;flex-wrap:wrap;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;color:#6E6A80;padding-top:6px\">\n    <div>10 superfícies + estados<\u002Fdiv><div>27 molduras<\u002Fdiv><div>0 ícones novos · 0 frases novas<\u002Fdiv><div>testIDs inalterados<\u002Fdiv><div>13 perguntas · 13 respondidas<\u002Fdiv><div>3 propostas<\u002Fdiv><div>revisões 1 e 2 aplicadas<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"max-width:1180px;border:1px solid #2A2836;border-radius:12px;padding:26px;display:flex;flex-direction:column;gap:14px\">\n  <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#777CE8\">revisão 1 · decidido pelo Marcel<\u002Fdiv>\n  <div style=\"font-size:15px;color:#A9A5B5;line-height:1.7;text-wrap:pretty\">Q1 limite A | B em <b style=\"color:#F9F5F1;font-weight:600\">700<\u002Fb>, condicionado à R1·2 (§11, que devolve a fronteira como Q13) · Q2 barra do palco em B com 88: <b style=\"color:#F9F5F1;font-weight:600\">sim<\u002Fb> · Q3 navegação do palco em A na <b style=\"color:#F9F5F1;font-weight:600\">barra superior<\u002Fb> · Q4 <b style=\"color:#F9F5F1;font-weight:600\">bloco próprio, pré-requisito do celular<\u002Fb> · Q5 faixa de A em duas linhas: <b style=\"color:#F9F5F1;font-weight:600\">sim, sem menu<\u002Fb> · Q6 <i>Adicionar<\u002Fi> e <i>Apagar<\u002Fi> são <b style=\"color:#F9F5F1;font-weight:600\">frases existentes<\u002Fb>, nome acessível longo · Q7 display de A em <b style=\"color:#F9F5F1;font-weight:600\">32<\u002Fb> · Q8 aviso que cresce: <b style=\"color:#F9F5F1;font-weight:600\">sim, e a regra é do componente, também em C<\u002Fb> · Q9 folha de A como cartão no topo: <b style=\"color:#F9F5F1;font-weight:600\">sim<\u002Fb> · Q10 chip empilhado <b style=\"color:#F9F5F1;font-weight:600\">não é frase nova<\u002Fb> · Q11 ordem do diálogo: <b style=\"color:#F9F5F1;font-weight:600\">sim<\u002Fb> · Q12 dumps de B e A; <b style=\"color:#F9F5F1;font-weight:600\">diferença acima de 4 dp é errata<\u002Fb>. P1 vira <b style=\"color:#F9F5F1;font-weight:600\">hipótese de aparato<\u002Fb>, P2 é <b style=\"color:#F9F5F1;font-weight:600\">decisão da implementação<\u002Fb>, P3 <b style=\"color:#F9F5F1;font-weight:600\">fica fora<\u002Fb>.<\u002Fdiv>\n  <div style=\"font-size:15px;color:#A9A5B5;line-height:1.7;text-wrap:pretty\">Registrado (R1·3): <b style=\"color:#F9F5F1;font-weight:600\">o corpo do palco em A não quebra linha; a quebra na letra (nunca na tab) é bloco próprio e pré-requisito do bloco de celular (N5).<\u002Fb><\u002Fdiv>\n  <div style=\"font-size:15px;color:#A9A5B5;line-height:1.7;text-wrap:pretty\">O que a revisão acrescenta, sem mudar nada do que estava desenhado: <b style=\"color:#F9F5F1;font-weight:600\">§7b<\u002Fb> palco em A com <i>baixando<\u002Fi> e <i>erro<\u002Fi>, e os demais estados por analogia · <b style=\"color:#F9F5F1;font-weight:600\">§11<\u002Fb> três molduras em 699 × 1054 · <b style=\"color:#F9F5F1;font-weight:600\">tabela de medidas por origem<\u002Fb>, com as folgas mais apertadas · <b style=\"color:#F9F5F1;font-weight:600\">Q13<\u002Fb>. Corrigido um número: <i>Salvar a ordem<\u002Fi> mede 191 [captura], não ≈ 186.<\u002Fdiv>\n  <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#777CE8;padding-top:4px\">revisão 2 · decidido pelo Marcel<\u002Fdiv>\n  <div style=\"font-size:15px;color:#A9A5B5;line-height:1.7;text-wrap:pretty\">Q13: <b style=\"color:#F9F5F1;font-weight:600\">não<\u002Fb> — tudo decide pela faixa, e o limite de <b style=\"color:#F9F5F1;font-weight:600\">700 vale para todos os componentes<\u002Fb>. Em 600–699 vale a composição de A inteira, como está nas molduras da §11. A regra de componente fica registrada na §11 como alternativa, com os três limiares medidos, marcada <i>herança do bloco iOS: iPad em janela<\u002Fi>. Nada mais muda.<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ============ SISTEMA ============ -->\n<section data-screen-label=\"0 sistema\" style=\"display:flex;flex-direction:column;gap:18px;max-width:1180px\">\n  <div style=\"font-family:Raleway,sans-serif;font-weight:600;font-size:22px;letter-spacing:.2em;text-transform:uppercase;color:#A9A5B5\">0 · o sistema em uma tabela<\u002Fdiv>\n  <div style=\"font-size:15px;color:#A9A5B5;line-height:1.6;text-wrap:pretty\">O que muda de faixa para faixa, em dp. A coluna C é o congelado, repetida só como controle.<\u002Fdiv>\n  <sc-raw-table style=\"border-collapse:collapse;width:100%;font-size:14px\">\n    <sc-raw-tr><sc-raw-td style=\"padding:10px 14px;border-bottom:1px solid #2A2836;fon · 132 dp<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:6px\">\n        <div style=\"width:411px;box-sizing:border-box;background:#100F16;border:1px solid #2A2836;display:flex;flex-direction:column;gap:8px;padding:14px 16px\"><div style=\"display:flex;gap:10px\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#E5686F\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none\"><path d=\"M12 4.2l8.4 14.8H3.6z\"><\u002Fpath><path d=\"M12 10v4\"><\u002Fpath><circle cx=\"12\" cy=\"16.9\" r=\"1.1\" fill=\"#E5686F\" stroke=\"none\"><\u002Fcircle><\u002Fsvg><div style=\"display:flex;flex-direction:column;gap:2px\"><div style=\"font-size:14px;line-height:20px;color:#E5686F\">Não foi possível salvar<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:18px;color:#A9A5B5\">[frase do conjunto fechado]<\u002Fdiv><div style=\"font-size:13px;line-height:20px;color:#A9A5B5\">a lista abaixo é a que o servidor acabou de devolver<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"padding-left:30px;display:flex\"><div style=\"height:36px;box-sizing:border-box;border:1px solid #2A2836;border-radius:8px;display:flex;align-items:center;gap:8px;padding:0 12px\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#F9F5F1\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 12a8 8 0 1 1-2.34-5.66M20 4v4h-4\"><\u002Fpath><\u002Fsvg><div style=\"font-size:14px;color:#F9F5F1\">Tentar de novo<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#6E6A80\">N3-A-X-falhou · 3 linhas + ação · ≈ 130 dp<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:6px\">\n        <div style=\"width:411px;min-height:48px;box-sizing:border-box;background:#100F16;border:1px solid #2A2836;display:fl 2Fi>: barra 184 (título em 2 linhas) + faixa 128 + aviso 132 = 444 dp antes da primeira linha, sobram 430 para a lista (3,5 linhas). É muito, e é o que a regra 7 exige: o estado existe e tem de ser lido.<\u002Fdiv>\n      <div style=\"font-size:14px;line-height:1.6;color:#A9A5B5;text-wrap:pretty\">A regra de uma frase por vez e a precedência de N2 (a que bloqueia mais vence) continuam. O aviso não rola com a lista em nenhuma faixa.<\u002Fdiv>\n      <div style=\"font-size:14px;line-height:1.6;color:#A9A5B5;text-wrap:pretty\">A ação de 36 dp desenhados tem alvo de 48 em todas as faixas, como em C: a folga de 6 acima e abaixo faz parte do alvo, não do desenho.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 11 · A EM 699 ============ -->\n<section data-screen-label=\"11 faixa A em 699\" style=\"display:flex;flex-direction:column;gap:22px\">\n  <div style=\"display:flex;gap:18px;align-items:baseline;flex-wrap:wrap\"><div style=\"font-family:Raleway,sans-serif;font-weight:600;font-size:22px;letter-spacing:.2em;text-transform:uppercase;color:#A9A5B5\">11 · a faixa A em 699 dp · R1·2<\u002Fdiv><div style=\"display:{{ dRegua }};font-family:'IBM Plex Mono',monospace;font-size:12px;color:#A9A5B5\">limite A | B em 700 · o pior caso de A é o mais largo · margem 16<\u002Fdiv><\u002Fdiv>\n  <div style=\"font-size:16px;color:#A9A5B5;line-height:1.6;max-width:1180px;text-wrap:pretty\"><b style=\"color:#F9F5F1;font-weight:600\">Resultado: nada quebra em 699 — nenhum controle some, nenhum texto encolhe, todos os alvos seguem ≥ 48.<\u002Fb> Mas a Q1 dizia que A “só ganha folga”, e isso é verdade só para as barras. Em três componentes a folga é tanta que a composição de A passa a <b style=\"color:#F9F5F1;font-weight:600\">desperdiçar altura<\u002Fb>: a faixa de edição cabe em uma linha, a linha de botões da folha cabe com o motivo ao lado, e o cartão de S1 comportaria o andar de C/B. Se esses três componentes decidirem pela própria largura (como a linha de aviso já decide, Q8), A em 699 vira, nesses pontos, a composição de B. É o que mudaria — a Q13, decidida na R2: tudo segue a faixa, e a composição de A vale inteira até 699.<\u002Fdiv>\n  <div style=\"display:flex;gap:40px;align-items:flex-start;flex-wrap:wrap\"><div style=\"display:flex;flex-direction:column;gap:10px;flex:none\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;color:#A9A5B5\"><span style=\"color:#777CE8\">N3-A699-S1<\u002Fspan> · composição A em 699 · 699 × 1054<\u002Fdiv><div style=\"width:699px;height:1054px;background:#100F16;border:1px solid #2A2836;border-radius:6px;overflow:hidden;display:flex;flex-direction:column;\"><div style=\"height:168px;flex:none;box-sizing:border-box;border-bottom:1px solid #2A2836;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:0 16px\">\n          <div style=\"height:36px;display:flex;align-items:center;font-family:Raleway,sans-serif;font-weight:600;font-size:26px;letter-spacing:.2em;text-transform:uppercase;color:#F9F5F1;white-space:nowrap\">Setlists<\u002Fdiv>\n          <div style=\"height:20px;display:flex;align-items:center;gap:8px\">\n            <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#A9A5B5\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none\"><path d=\"M20.5 12a8.5 8.5 0 1 1-2.5-6M20.5 3.5V6H18\"><\u002Fpath><path d=\"M12 8.5V12l2.6 1.6\"><\u002Fpath><\u002Fsvg>\n            <div style=\"font-size:13px;color:#A9A5B5;white-space:nowrap\">sincronizado agora<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:12px;margin-top:4px\">\n            <div style=\"flex:1;height:58px;box-sizing:border-box;border:1px solid #2A2836;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:10px\">\n              <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#777CE8\" stroke-width=\"1 ht:600;font-size:22px;letter-spacing:.2em;text-transform:uppercase;color:#A9A5B5\">ícones<\u002Fdiv>\n    <div style=\"font-size:15px;color:#A9A5B5;line-height:1.6;text-wrap:pretty\"><b style=\"color:#F9F5F1;font-weight:600\">Nenhum ícone novo.<\u002Fb> O catálogo continua em 39. Nenhum desenho, tamanho ou traço muda de faixa para faixa: 20 para metadado, chip e aviso; 24 para controle de lista, faixa e folha; 28 para o palco.<\u002Fdiv>\n    <sc-raw-table style=\"border-collapse:collapse;width:100%;font-size:14px\">\n      <sc-raw-tr><sc-raw-td style=\"padding:10px 14px;border-bottom:1px solid #2A2836;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#6E6A80;width:230px\">ícone<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 14px;border-bottom:1px solid #2A2836;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#6E6A80;width:130px\">estado<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 14px;border-bottom:1px solid #2A2836;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#6E6A80\">onde muda de lugar<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"padding:9px 14px;border-bottom:1px solid #1E1C28;color:#F9F5F1\">índice · busca · sair (28)<\u002Fsc-raw-td><sc-raw-td style=\"padding:9px 14px;border-bottom:1px solid #1E1C28;color:#A9A5B5\">existente<\u002Fsc-raw-td><sc-raw-td style=\"padding:9px 14px;border-bottom:1px solid #1E1C28;color:#A9A5B5\">A: sobem para a barra superior do palco<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"padding:9px 14px;border-bottom:1px solid #1E1C28;color:#F9F5F1\">adicionar · alça · renomear · apagar setlist (24)<\u002Fsc-raw-td><sc-raw-td style=\"padding:9px 14px;border-bottom:1px solid #1E1C28;color:#A9A5B5\">existente (E17)<\u002Fsc-raw-td><sc-raw-td style=\"padding:9px 14px;border-bottom:1px solid #1E1C28;color:#A9A5B5\">A: faixa em duas linhas; nenhum vira ícone sozinho<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"padding:9px 14px;border-bottom:1px solid #1E1C28;color:#F9F5F1\">tipo de conteúdo (20)<\u002Fsc-raw-td><sc-raw-td style=\"padding:9px 14px;border-bottom:1px solid #1E1C28;color:#A9A5B5\">existente<\u002Fsc-raw-td><sc-raw-td style=\"padding:9px 14px;border-bottom:1px solid #1E1C28;color:#A9A5B5\">A: terceiro andar da linha de S2<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"padding:9px 14px;border-bottom:1px solid #1E1C28;color:#F9F5F1\">sem conexão · última sincronização (20)<\u002Fsc-raw-td><sc-raw-td style=\"padding:9px 14px;border-bottom:1px solid #1E1C28;color:#A9A5B5\">existente<\u002Fsc-raw-td><sc-raw-td style=\"padding:9px 14px;border-bottom:1px solid #1E1C28;color:#A9A5B5\">A: linha própria na barra de S1<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"padding:9px 14px;color:#F9F5F1\">todos os demais<\u002Fsc-raw-td><sc-raw-td style=\"padding:9px 14px;color:#A9A5B5\">existente<\u002Fsc-raw-td><sc-raw-td style=\"padding:9px 14px;color:#A9A5B5\">sem mudança<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-table>\n    <div style=\"font-size:13px;color:#6E6A80;line-height:1.6\">Os quatro ícones de tipo desta folha são redesenhos rápidos para a moldura; a referência é o catálogo do V1.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ PROPOSTAS ============ -->\n<section data-screen-label=\"propostas fora do brief\" style=\"display:flex;flex-direction:column;gap:20px;max-width:1180px\">\n  <div style=\"font-family:Raleway,sans-serif;font-weight:600;font-size:22px;letter-spacing:.2em;text-transform:uppercase;color:#A9A5B5\">propostas fora do brief<\u002Fdiv>\n  <div style=\"font-size:15px;color:#A9A5B5;line-height:1.6\">Nada disto está desenhado nas molduras.<\u002Fdiv>\n  <div style=\"display:flex;gap:24px;flex-wrap:wrap\">\n    <div style=\"flex:1;min-width:320px;border:1px solid #2A2836;border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:10px\">\n      <div style=\"font-size:17px;font-weight:600;color:#F9F5F1\">P1 · tirar o FAB do dev client do canto superior direito<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#777CE8\">R1 · vira hipótese de aparato<\u002Fdiv>\n      <div style=\"font-size:14px;color:#A9A5B5;line-height:1.6;text-wrap:pretty\">Em todas as capturas de retrato o botão de ferramentas do build de dev cobre o canto superior direito: tampa <i>Apagar o que foi digitado<\u002Fi> na busca e, em A, cairia sobre <i>sair<\u002Fi> do palco. Mover para o canto inferior esquerdo nos builds de dev evita dumps contaminados. <b style=\"color:#F9F5F1;font-weight:600\">Custo:<\u002Fb> nenhum no produto.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;min-width:320px;border:1px solid #2A2836;border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:10px\">\n      <div style=\"font-size:17px;font-weight:600;color:#F9F5F1\">P2 · a faixa como troca de valores no theme.ts<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#777CE8\">R1 · decisão da implementação<\u002Fdiv>\n      <div style=\"font-size:14px;color:#A9A5B5;line-height:1.6;text-wrap:pretty\">Margem lateral (32/24 em C e B, 16 em A), altura das barras e número de linhas da faixa de edição como tokens por faixa. A composição ficaria uma só, com três jogos de valores. <b style=\"color:#F9F5F1;font-weight:600\">Custo:<\u002Fb> errata no theme.ts e na regra de que o README é o original.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;min-width:320px;border:1px solid #2A2836;border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:10px\">\n      <div style=\"font-size:17px;font-weight:600;color:#F9F5F1\">P3 · palco A: barras recolhem durante o auto-scroll<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#777CE8\">R1 · fica fora<\u002Fdiv>\n      <div style=\"font-size:14px;color:#A9A5B5;line-height:1.6;text-wrap:pretty\">Com auto-scroll ligado, as duas barras saem e o corpo vai de 634 para 874 dp; um toque no centro as traz de volta. <b style=\"color:#F9F5F1;font-weight:600\">Custo:<\u002Fb> muda comportamento, cria um estado novo e disputa o toque com as zonas de borda.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ PERGUNTAS ============ -->\n<section data-screen-label=\"perguntas\" style=\"display:flex;flex-direction:column;gap:20px;max-width:1180px\">\n  <div style=\"font-family:Raleway,sans-serif;font-weight:600;font-size:22px;letter-spacing:.2em;text-transform:uppercase;color:#A9A5B5\">perguntas<\u002Fdiv>\n  <div style=\"font-size:15px;color:#A9A5B5;line-height:1.6\">Treze, todas respondidas: as doze primeiras na revisão 1, a 13 na revisão 2 (quadro no topo da folha). Ficam como histórico da decisão.<\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:14px\">\n    <div style=\"display:flex;gap:18px;border-top:1px solid #2A2836;padding-top:14px\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;color:#777CE8;width:28px;flex:none\">1<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"font-size:16px;color:#F9F5F1;line-height:1.5\">A faixa B começa em 600, mas a composição de B pede 684 dp (faixa de S2e: 683,5). Entre 600 e 683 ela quebra de novo — é o caso do iPad em janela.<\u002Fdiv><div style=\"font-size:14px;color:#A9A5B5;line-height:1.6\"><b style=\"color:#F9F5F1;font-weight:600\">Recomendo mover o limite A | B para 700<\u002Fb>: de 600 a 699 vale a composição de A, que é fluida e só ganha folga. A alternativa é B usar a faixa de duas linhas abaixo de 684, o que cria uma quarta composição.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;gap:18px;border-top:1px solid #2A2836;padding-top:14px\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;color:#777CE8;width:28px;flex:none\">2<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"font-size:16px;color:#F9F5F1;line-height:1.5\">Barra superior do palco em B com 88 dp em duas linhas, tirando 24 dp do corpo?<\u002Fdiv><div style=\"font-size:14px;color:#A9A5B5;line-height:1.6\"><b style=\"color:#F9F5F1;font-weight:600\">Recomendo sim.<\u002Fb> O título passa de 405 elidido para 663, e o corpo em retrato tem 870 dp de altura, mais que os 479 de C.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;gap:18px;border-top:1px solid #2A2836;padding-top:14px\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;color:#777CE8;width:28px;flex:none\">3<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"font-size:16px;color:#F9F5F1;line-height:1.5\">Palco em A: índice, busca e sair na barra superior, ou a barra inferior em duas linhas (172 dp)?<\u002Fdiv><div style=\"font-size:14px;color:#A9A5B5;line-height:1.6\"><b style=\"color:#F9F5F1;font-weight:600\">Recomendo a barra superior.<\u002Fb> Os dois grupos de C continuam juntos, os controles continuam com 64, e o corpo fica 20 dp maior. O custo é o polegar: <i>sair<\u002Fi> fica longe da mão — que é também o que o protege de um toque acidental.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;gap:18px;border-top:1px solid #2A2836;padding-top:14px\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;color:#777CE8;width:28px;flex:none\">4<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"font-size:16px;color:#F9F5F1;line-height:1.5\">O corpo do palco não quebra linha. Em A, com 22 dp, cabem ≈ 26 colunas e a maioria das linhas de letra é cortada. Isso fica assim?<\u002Fdiv><div style=\"font-size:14px;color:#A9A5B5;line-height:1.6\"><b style=\"color:#F9F5F1;font-weight:600\">Recomendo abrir um bloco próprio<\u002Fb>, fora do N3: quebra de linha na letra, e nunca na tab, que perde o alinhamento. O brief proíbe redesenhar o corpo, então esta folha não toca nele.<\u002Fdiv><div style=\"font-size:14px;color:#F9F5F1;line-height:1.6\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#777CE8\">decidido · R1·3<\u002Fspan> O corpo do palco em A não quebra linha; a quebra na letra (nunca na tab) é bloco próprio e pré-requisito do bloco de celular (N5).<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;gap:18px;border-top:1px solid #2A2836;padding-top:14px\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;color:#777CE8;width:28px;flex:none\">5<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"font-size:16px;color:#F9F5F1;line-height:1.5\">A faixa de edição em A com duas linhas de 48 (128 dp)?<\u002Fdiv><div style=\"font-size:14px;color:#A9A5B5;line-height:1.6\"><b style=\"color:#F9F5F1;font-weight:600\">Recomendo sim.<\u002Fb> Nenhum par de ícones sozinhos resolve (faltam 20,5 dp mesmo no melhor par), e três ícones sem rótulo seria ir contra o V1. A outra saída é um menu que agrupa <i>Renomear<\u002Fi> e <i>Apagar<\u002Fi> — um controle a mais, que a regra 2 manda perguntar e que eu não recomendo.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;gap:18px;border-top:1px solid #2A2836;padding-top:14px\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;color:#777CE8;width:28px;flex:none\">6<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"font-size:16px;color:#F9F5F1;line-height:1.5\"><i>Adicionar<\u002Fi> e <i>Apagar<\u002Fi> como rótulos da faixa em B e A: são frases do conjunto (picker e diálogo) num lugar novo. Contam como frase nova?<\u002Fdiv><div style=\"font-size:14px;color:#A9A5B5;line-height:1.6\"><b style=\"color:#F9F5F1;font-weight:600\">Recomendo tratá-las como existentes<\u002Fb>, com o nome acessível longo (<i>Adicionar música<\u002Fi>, <i>Apagar setlist<\u002Fi>) mantido. Se contarem como novas, B passa a precisar de 788,5 dp e volta a quebrar.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;gap:18px;border-top:1px solid #2A2836;padding-top:14px\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;color:#777CE8;width:28px;flex:none\">7<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"font-size:16px;color:#F9F5F1;line-height:1.5\">O degrau do display em A: 32 dp, .2em, uma linha?<\u002Fdiv><div style=\"font-size:14px;color:#A9A5B5;line-height:1.6\"><b style=\"color:#F9F5F1;font-weight:600\">Recomendo 32.<\u002Fb> Ocupa 334 de 379. 36 fica sem folga (376); 28 empata com os títulos de 26.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;gap:18px;border-top:1px solid #2A2836;padding-top:14px\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;color:#777CE8;width:28px;flex:none\">8<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"font-size:16px;color:#F9F5F1;line-height:1.5\">A linha de aviso cresce (48 mínimos, +20 por linha) em vez de elidir?<\u002Fdiv><div style=\"font-size:14px;color:#A9A5B5;line-height:1.6\"><b style=\"color:#F9F5F1;font-weight:600\">Recomendo sim<\u002Fb>, e que a regra valha também para C, onde hoje todas as frases cabem em uma linha. Motivo cortado não é motivo legível.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;gap:18px;border-top:1px solid #2A2836;padding-top:14px\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;color:#777CE8;width:28px;flex:none\">9<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"font-size:16px;color:#F9F5F1;line-height:1.5\">A folha em A é um cartão ancorado no topo com 16 dp de margem, não uma folha inferior. Pode ser assim?<\u002Fdiv><div style=\"font-size:14px;color:#A9A5B5;line-height:1.6\"><b style=\"color:#F9F5F1;font-weight:600\">Recomendo sim.<\u002Fb> Não depende de gesto de sistema (regra 10), fica sempre acima do teclado e é a mesma folha de C e B com outra largura.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;gap:18px;border-top:1px solid #2A2836;padding-top:14px\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;color:#777CE8;width:28px;flex:none\">10<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"font-size:16px;color:#F9F5F1;line-height:1.5\">No chip de S1 em B, <i>sem conexão<\u002Fi> e <i>última sincronização agora<\u002Fi> empilham e o “·” sai. É mudança de frase?<\u002Fdiv><div style=\"font-size:14px;color:#A9A5B5;line-height:1.6\"><b style=\"color:#F9F5F1;font-weight:600\">Recomendo que não seja<\u002Fb>: as duas partes são as mesmas, e a quebra faz o papel do separador. Se for, o chip vai para uma linha própria como em A e a barra de B passa a 168.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;gap:18px;border-top:1px solid #2A2836;padding-top:14px\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;color:#777CE8;width:28px;flex:none\">11<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"font-size:16px;color:#F9F5F1;line-height:1.5\">No diálogo de A, <i>Manter a setlist<\u002Fi> em cima e <i>Apagar<\u002Fi> embaixo?<\u002Fdiv><div style=\"font-size:14px;color:#A9A5B5;line-height:1.6\"><b style=\"color:#F9F5F1;font-weight:600\">Recomendo sim<\u002Fb>: é a ordem de leitura de C (esquerda → direita vira cima → baixo), e o destrutivo continua sendo o segundo.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;gap:18px;border-top:1px solid #2A2836;border-bottom:1px solid #2A2836;padding:14px 0\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;color:#777CE8;width:28px;flex:none\">12<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"font-size:16px;color:#F9F5F1;line-height:1.5\">As larguras de texto vêm das capturas (px ÷ densidade) e as somas são minhas. Quem confere?<\u002Fdiv><div style=\"font-size:14px;color:#A9A5B5;line-height:1.6\"><b style=\"color:#F9F5F1;font-weight:600\">Recomendo<\u002Fb> que a implementação entregue dumps de B e A no formato do MEDIDAS.md, e que qualquer diferença acima de 4 dp vire errata desta folha. As folgas mais apertadas são a faixa de B (27,5) e a linha de botões do diálogo em A (0, por isso empilhei).<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;gap:18px;border-bottom:1px solid #2A2836;padding:14px 0\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;color:#777CE8;width:28px;flex:none\">13<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"font-size:16px;color:#F9F5F1;line-height:1.5\">Em 699, a composição de A não quebra, mas três componentes — a faixa de edição de S2, a linha de botões da folha e o cartão de S1 — caberiam na forma de B. Eles seguem a faixa, ou decidem pela própria largura, como a linha de aviso (Q8)?<\u002Fdiv><div style=\"font-size:14px;color:#A9A5B5;line-height:1.6\"><b style=\"color:#F9F5F1;font-weight:600\">Recomendo que decidam pela própria largura<\u002Fb>, com os limiares medidos: faixa de edição em uma linha a partir de 667,5 dp de conteúdo + margens; linha de botões da folha com o motivo ao lado a partir de 474 dp úteis; cartão de S1 com baixar e estado no mesmo andar a partir de ≈ 430. O limite de 700 continua valendo para as barras de S1, S2 e do palco. A alternativa é manter tudo pela faixa: mais simples de testar, e em 600–699 perde até 64 dp de lista em S2e.<\u002Fdiv><div style=\"font-size:14px;color:#F9F5F1;line-height:1.6\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#777CE8\">decidido · R2<\u002Fspan> Não: tudo decide pela faixa, e o limite de 700 vale para todos os componentes. A regra de componente fica registrada na §11 como alternativa, herança do bloco iOS (iPad em janela).<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1600,&quot;height&quot;:1000},&quot;faixa&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ambas&quot;,&quot;B&quot;,&quot;A&quot;],&quot;default&quot;:&quot;ambas&quot;,&quot;tsType&quot;:&quot;'ambas'|'B'|'A'&quot;,&quot;section&quot;:&quot;Folha&quot;},&quot;mostrarNotas&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Folha&quot;},&quot;mostrarRegua&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Folha&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const p = this.props;\n    const h = React.createElement;\n    const ic = (paths, o = {}) => {\n      const s = o.s || 20, c = o.c || '#6E6A80', w = o.w || 1.5;\n      const kids = paths.map((d, i) => h('path', { key: 'p' + i, d }));\n      (o.dots || []).forEach((d, i) => kids.push(h('circle', { key: 'c' + i, cx: d[0], cy: d[1], r: d[2] || 1.3, fill: c, stroke: 'none' })));\n      return h('svg', { width: s, height: s, viewBox: '0 0 24 24', fill: 'none', stroke: c, strokeWidth: w, strokeLinecap: 'round', strokeLinejoin: 'round', style: { flex: 'none' } }, kids);\n    };\n    const tipo = {\n      Letra: () => ic(['M4 5.25h13M4 9.75h16M4 14.25h10M4 18.75h14']),\n      Cifra: () => ic(['M4 6h4M11 6h4M18 6h2', 'M4 10.5h16', 'M4 15h4M11 15h4M18 15h2', 'M4 19.5h16']),\n      Tab: () => ic(['M4 6h16M4 10h16M4 14h16M4 18h16'], { dots: [[9, 10, 1.6], [15, 14, 1.6]] }),\n      Partitura: () => ic(['M4 5h16M4 9h16M4 13h16M4 17h16', 'M11.5 17V9'], { dots: [[9.5, 17, 2]] })\n    };\n    const raw = [\n      ['1', 'Manhã de ensaio', 'Banda da fixture', 'Letra'],\n      ['2', 'Segunda do ensaio', 'Duo Manacá', 'Cifra'],\n      ['3', 'Terceira do ensaio', 'Trio de fixture', 'Tab'],\n      ['4', 'Partitura de doze páginas', 'Orquestra de fixture', 'Partitura'],\n      ['5', 'Partitura que nunca baixou', 'Orquestra de fixture', 'Partitura'],\n      ['6', 'Uma música de título bem comprido, para medir a quebra', 'Artista de nome igualmente comprido da fixture do N3', 'Letra'],\n      ['7', 'Sétima do ensaio', 'Banda da fixture', 'Cifra'],\n      ['8', 'Oitava do ensaio', 'Banda da fixture', 'Letra']\n    ];\n    const songs = raw.map(r => ({ n: r[0], t: r[1], a: r[2], tipo: r[3], ic: tipo[r[3]]() }));\n    const parcial = () => h('svg', { width: 28, height: 28, viewBox: '0 0 24 24', fill: 'none', strokeWidth: 2, strokeLinecap: 'round', style: { flex: 'none' } },\n      h('circle', { key: 'a', cx: 12, cy: 12, r: 9, stroke: '#6E6A80' }), h('path', { key: 'b', d: 'M12 3a9 9 0 0 1 0 18', stroke: '#C9923B' }));\n    const garantida = () => ic(['M8 12.2l2.8 2.8L16.2 9.4', 'M21 12a9 9 0 1 1-18 0a9 9 0 1 1 18 0'], { s: 28, c: '#F9F5F1', w: 2 });\n    const setlists = [\n      { nome: 'Ensaio de retrato', data: 'sem data', lugar: '', temLugar: false, musicas: '8 músicas', estado: 'parcial', cor: '#C9923B', sub: '1 de 2 arquivos baixados', ic: parcial(), baixar: true, baixarAtivo: true },\n      { nome: 'Show de sexta no teatro da fixture', data: '2026-09-25', lugar: 'Teatro da fixture', temLugar: true, musicas: '4 músicas', estado: 'garantida offline', cor: '#F9F5F1', sub: 'todos os arquivos neste aparelho', ic: garantida(), baixar: false, baixarAtivo: false },\n      { nome: 'Setlist curta da fixture', data: 'sem data', lugar: '', temLugar: false, musicas: '2 músicas', estado: 'garantida offline', cor: '#F9F5F1', sub: 'nada a baixar', ic: garantida(), baixar: true, baixarAtivo: false }\n    ];\n    const faixa = p.faixa ?? 'ambas';\n    const letra = [\n      '[Verso 1]', 'Quando a noite chega o ensaio começa (fixture do N3)', 'A sala acende e o metrônomo conta até quatro', '',\n      '[Refrão]', 'Linha de refrão escrita para medir quebra de linha', 'Outra linha curta', '', '[Verso 2]'\n    ];\n    for (let i = 1; i <= 16; i++) letra.push('Linha ' + i + ' do verso de fixture, para rolar a tela do palco');\n    return {\n      dNotas: (p.mostrarNotas ?? true) ? 'flex' : 'none',\n      dRegua: (p.mostrarRegua ?? true) ? 'block' : 'none',\n      dB: faixa === 'A' ? 'none' : 'flex',\n      dA: faixa === 'B' ? 'none' : 'flex',\n      songs,\n      songs5: songs.slice(0, 5),\n      songs6: songs.slice(0, 6),\n      songsRest: songs.slice(1),\n      setlists: setlists.map(s => ({ ...s, baixarInativo: s.baixar && !s.baixarAtivo })),\n      letra: letra.join('\\n'),\n      marcas: [1, 2, 3, 4, 5, 6, 7, 8]\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
