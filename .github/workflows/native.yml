# N0-PR2 (N0-PRECHECK C4-2): build verificável do nativo por PR — APK de debug local, sem EAS, sem segredo.
# Só roda quando o nativo muda (filtro de paths); PRs de web ou de core não o executam.
# Recorte da N1-PR8 (decisão do Marcel, 2026-09-10, N1-h3): `packages/core/**` e
# `pnpm-lock.yaml` saíram do filtro. O gate custou 10m15s–14m15s nas sete medições do
# N1 (mediana ~11m45s), acima dos ~9 min aceitáveis, e mudança só de core já é coberta
# pelo `build` (que roda o `pnpm test` inteiro, incluindo o projeto `core`). O que o
# APK de fato depende — `apps/native/**`, o próprio workflow e o `pnpm-workspace.yaml` —
# continua disparando.
#
# W4-b2, H1 (o B8.1): o `paths` do `pull_request` é avaliado contra o diff
# ACUMULADO da PR, então um push só de docs numa PR que já tocou o nativo
# custava um APK inteiro (no N2, 7 corridas, 83m32s — `N2-ENCERRAMENTO.md` §7).
# O `paths` fica como filtro de FORA (PR que nunca tocou o nativo nem dispara);
# por dentro, o job `mudou-nativo` olha o que ESTE push mudou (`before..head`)
# e o APK só roda se o push tocou um dos três caminhos. Push só de docs → o
# `android-debug-apk` aparece `skipped`. Ele não é exigido pelo ruleset, então
# nada bloqueia. Na dúvida — abertura, reopen, push forçado, push na `main` —
# roda. A lista de caminhos está escrita duas vezes (aqui e no script); mudar
# uma é mudar as duas.
#
# Antes do merge da W4-b2 (decisões do Marcel, 2026-09-23):
#   • o que conta como nativo inclui os dois workflows de que o APK e o
#     detector dependem — este `native.yml` e o `gates.yml` — e o próprio
#     `apps/native/scripts/mudou-nativo.sh` (já coberto por `apps/native/**`).
#     O `gates.yml` entrou também no `paths` abaixo, senão uma PR que só o
#     tocasse nem dispararia este workflow;
#   • div. 360: o detector só pula o APK se o último APK desta PR foi
#     `success`. Depois de um vermelho (ou sem APK anterior), até um push só
#     de docs roda — o vermelho não some da lista de checks da PR. Por isso o
#     `mudou-nativo` tem `actions: read` e o `GITHUB_TOKEN`;
#   • div. 353: push forçado roda (padrão seguro); e push forçado em PR é
#     contra a regra (`LOGS-OCTAVIA.md`, "Errata W4-b2").
name: native
'on':
  pull_request:
    paths:
    - apps/native/**
    - .github/workflows/native.yml
    - .github/workflows/gates.yml
    - pnpm-workspace.yaml
  push:
    branches:
    - main
    paths:
    - apps/native/**
    - .github/workflows/native.yml
    - .github/workflows/gates.yml
    - pnpm-workspace.yaml
env:
  EXPO_NO_TELEMETRY: '1'
  CI: '1'
jobs:
  mudou-nativo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      nativo: ${{ steps.d.outputs.nativo }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - id: d
      env:
        ACAO: ${{ github.event.action }}
        ANTES: ${{ github.event.before }}
        BRANCH: ${{ github.head_ref }}
        GH_TOKEN: ${{ github.token }}
      run: sh apps/native/scripts/mudou-nativo.sh "$ACAO" "$ANTES" HEAD >> "$GITHUB_OUTPUT"
  android-debug-apk:
    needs: mudou-nativo
    if: needs.mudou-nativo.outputs.nativo == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
    # Bump para v4 + `packages` explícito (2026-09-14). O `v3` com o default
    # `tools platform-tools` passou a reprovar em ~27 s no `sdkmanager`
    # (`Failed to find package 'tools'`) — o `tools` é pacote APOSENTADO do SDK,
    # e o cmdline-tools 16.0 da imagem do runner deixou de tolerá-lo.
    # O `v4` sozinho NÃO basta: o default dele continua sendo
    # `tools platform-tools` (lido no `action.yml` da tag v4). Quem tira a causa
    # é o `packages` explícito — o build não precisa do `tools`: o Gradle baixa
    # a `platform`/`build-tools` de que precisa, e o `platform-tools` é o que a
    # imagem usa para `adb`.
    - uses: android-actions/setup-android@v4
      with:
        packages: platform-tools
    - uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/native/app.json') }}
        restore-keys: |
          gradle-${{ runner.os }}-
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Type-check apps/native
      run: pnpm --filter native run type-check
    - name: Prebuild (android)
      run: cd apps/native && npx expo prebuild --platform android --no-install
    - name: Gradle assembleDebug
      run: cd apps/native/android && ./gradlew assembleDebug --no-daemon
    - uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        path: apps/native/android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
